// This is a minimal setup of a Forge mod workspace.
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see our examples repository.
// https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

base.archivesName = 'fpvdrone'
version = '26.3-1.0.19'
group = 'com.taylorgoolsby.fpvdrone'

// Mojang ships Java 25 to end users in 26.1+, so your mod should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'fpvdrone'
        }

        register('client') {
            jvmArgs '-XstartOnFirstThread'
            // Dev only: keyboard-driven virtual joystick (WASD + arrows). Remove to test with no controller.
            systemProperty 'fpvdrone.virtual', 'true'
            args '-mixin.config=fpvdrone.mixins.json'
        }

        register('server') {
            args '--nogui'
            args '-mixin.config=fpvdrone.mixins.json'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'fpvdrone', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

// Libraries that are copied into the mod jar ("shaded"), so the jar works on its own.
configurations {
    shade {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.1.0')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'

    // SQLite JDBC driver for the race database. It is loaded by name at runtime,
    // so no code compiles against it. `implementation` puts it on the dev run
    // classpath; `shade` copies it into the built jar.
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    shade 'org.xerial:sqlite-jdbc:3.46.1.3'
}

tasks.withType(JavaCompile).configureEach {
    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    manifest {
        attributes['MixinConfigs'] = 'fpvdrone.mixins.json'
    }

    // Copy the shaded libraries' classes and native libraries into the mod jar.
    from {
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        // Not needed, and a nested module-info or manifest would confuse the mod loader.
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/versions/*/module-info.class'
        exclude 'module-info.class'
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        exclude 'META-INF/maven/**'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}